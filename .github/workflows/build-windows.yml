name: Build QEMU IA-64 (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: minimal
          update: true
          install: >-
            base-devel
            git
            pkgconf
            diffutils
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-pixman
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libslirp
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-capstone

      - name: Environment
        run: |
          export PATH=/mingw64/bin:$PATH

          echo "==== PATH ===="
          echo $PATH

          echo "==== Python ===="
          which python
          python --version

          echo "==== Meson ===="
          which meson
          meson --version

          echo "==== Ninja ===="
          which ninja
          ninja --version

          echo "==== GCC ===="
          which gcc
          gcc --version

      - name: Configure
        run: |
          export PATH=/mingw64/bin:$PATH

          chmod +x configure

          ./configure \
            --target-list=ia64-softmmu \
            --enable-gtk

      - name: Build IA64 only
        run: |
          export PATH=/mingw64/bin:$PATH

          ninja -C build \
            qemu-system-ia64 \
            roms/ia64-firmware/ia64-firmware.bin

      - name: Collect
        if: always()
        run: |
          mkdir -p artifacts

          echo "===== EXE ====="
          find build -name "qemu-system-ia64*" || true

          echo "===== Firmware ====="
          find build -name "ia64-firmware.bin" || true

          if [ -f build/qemu-system-ia64.exe ]; then
              cp build/qemu-system-ia64.exe artifacts/
          elif [ -f build/qemu-system-ia64 ]; then
              cp build/qemu-system-ia64 artifacts/
          fi

          if [ -f build/roms/ia64-firmware/ia64-firmware.bin ]; then
              mkdir -p artifacts/roms/ia64-firmware
              cp build/roms/ia64-firmware/ia64-firmware.bin \
                 artifacts/roms/ia64-firmware/
          fi

          cp /mingw64/bin/*.dll artifacts/ 2>/dev/null || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-system-ia64-windows
          path: artifacts
