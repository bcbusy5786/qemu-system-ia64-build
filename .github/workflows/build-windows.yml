name: Build QEMU IA64 (Linux)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            meson \
            pkg-config \
            python3 \
            python3-pip \
            python3-venv \
            git \
            libglib2.0-dev \
            libpixman-1-dev \
            zlib1g-dev \
            libsdl2-dev \
            libgtk-3-dev \
            libslirp-dev \
            libcapstone-dev

      - name: Environment
        run: |
          uname -a
          gcc --version
          python3 --version
          meson --version
          ninja --version

      - name: Configure
        run: ./configure --enable-gtk

      - name: Show Targets
        run: |
          echo "========== IA64 =========="
          ninja -C build -t targets all | grep ia64 || true

          echo "========== QEMU =========="
          ninja -C build -t targets all | grep qemu || true

      - name: Build
        run: |
          ninja -C build

      - name: Show Build Files
        if: always()
        run: |
          find build -type f | sort

      - name: Collect
        if: always()
        run: |
          mkdir artifacts

          find build -name "qemu-system-ia64*" -exec cp {} artifacts/ \; || true
          find build -name "*.bin" -exec cp {} artifacts/ \; || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-ia64-linux
          path: artifacts
