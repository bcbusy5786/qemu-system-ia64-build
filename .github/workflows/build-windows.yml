name: Build QEMU IA-64 (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: minimal
          update: true
          install: >-
            base-devel
            git
            make
            ninja
            meson
            pkgconf
            diffutils
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-pixman
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libslirp
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-capstone

      - name: Show Environment
        run: |
          export PATH=/mingw64/bin:$PATH

          echo "===== PATH ====="
          echo "$PATH"

          echo
          echo "===== Python ====="
          which python
          python --version

          which pip
          pip --version

          echo
          echo "===== GCC ====="
          which gcc
          gcc --version

          echo
          echo "===== Meson ====="
          which meson
          meson --version

          echo
          echo "===== Ninja ====="
          which ninja
          ninja --version

      - name: Detect Build System
        id: detect
        run: |
          export PATH=/mingw64/bin:$PATH

          if [ -f configure ]; then
            echo "type=configure" >> "$GITHUB_OUTPUT"
          elif [ -f meson.build ]; then
            echo "type=meson" >> "$GITHUB_OUTPUT"
          else
            echo "Repository files:"
            ls -la
            exit 1
          fi

      - name: Configure (configure)
        if: steps.detect.outputs.type == 'configure'
        run: |
          export PATH=/mingw64/bin:$PATH

          which python
          python --version

          chmod +x configure

          ./configure \
            --target-list=ia64-softmmu \
            --enable-slirp \
            --enable-sdl

      - name: Configure (meson)
        if: steps.detect.outputs.type == 'meson'
        run: |
          export PATH=/mingw64/bin:$PATH

          meson setup build

      - name: Build (configure)
        if: steps.detect.outputs.type == 'configure'
        run: |
          export PATH=/mingw64/bin:$PATH

          make -j$(nproc)

      - name: Build (meson)
        if: steps.detect.outputs.type == 'meson'
        run: |
          export PATH=/mingw64/bin:$PATH

          ninja -C build

      - name: Collect Artifacts
        if: always()
        run: |
          mkdir -p artifacts

          find . -iname "*.exe" -exec cp {} artifacts/ \; || true

          if [ -d pc-bios ]; then
            cp -r pc-bios artifacts/
          fi

          if [ -d build/pc-bios ]; then
            cp -r build/pc-bios artifacts/
          fi

          cp /mingw64/bin/*.dll artifacts/ 2>/dev/null || true

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-ia64-windows
          path: artifacts
